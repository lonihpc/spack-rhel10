# Compiler configuration for the "hpc-software" environment.
#
# IMPORTANT: Spack v1.2.x removed compilers.yaml. Compilers are now declared
# as external packages right here in packages.yaml (with a `compiler` tag),
# see `spack/lib/spack/docs/configuring_compilers.rst` in the cloned repo.
# An old-style compilers.yaml is still auto-migrated by Spack (with a
# deprecation warning) into this same format, so there is no separate
# compilers.yaml file in this repo - this replaces step 1 from the request.
#
# None of the paths/versions below exist on this WSL2 machine - they are
# placeholders. Decided stack (per user, supersedes the old cluster's
# gcc/nvhpc/intel mix): Intel oneAPI + Intel MPI is the mainstream toolchain
# for everything; nvhpc is kept only for packages that need GPU support
# (pin explicitly with `%nvhpc` per package, not as a default provider);
# gcc is kept registered purely as a last-resort fallback for the rare
# package that doesn't build with icx/icpx/ifx - it is NOT a default
# provider anymore (see `all.providers` below). mvapich/mpich are no longer
# part of the mainstream stack at all. Once we're on the real RHEL10 node,
# replace these with `spack compiler find <path>` output / real
# `spack external find` results.
packages:
  intel-oneapi-compilers:
    externals:
    - spec: intel-oneapi-compilers@2026.0.0
      # TODO(cluster): confirm actual installed oneAPI version - 2026.0.0 is
      # CLAUDE.md's stated target, verify against what Intel has shipped by
      # the time we install on real hardware.
      prefix: /opt/intel/oneapi
      extra_attributes:
        compilers:
          c: /opt/intel/oneapi/compiler/2026.0.0/bin/icx
          cxx: /opt/intel/oneapi/compiler/2026.0.0/bin/icpx
          fortran: /opt/intel/oneapi/compiler/2026.0.0/bin/ifx
    buildable: false

  # Fallback only - not a default provider (see all.providers below). Kept
  # registered in case some package genuinely refuses to build with icx.
  gcc:
    externals:
    - spec: "gcc@14 languages='c,c++,fortran'"
      # TODO(cluster): confirm RHEL10's actual base gcc version/path (RHEL10
      # ships gcc 14.x by default at the time of writing, but verify).
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    buildable: true # also allow Spack to build other gcc versions if needed

  # GPU compiler - pin explicitly per package (`%nvhpc`) when +cuda is
  # needed, rather than relying on default provider ordering.
  nvhpc:
    externals:
    - spec: nvhpc@24.1
      # TODO(cluster): confirm exact NVHPC version/path once GPU node
      # details (model, driver) are known.
      prefix: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1
      extra_attributes:
        compilers:
          c: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1/compilers/bin/nvc
          cxx: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1/compilers/bin/nvc++
          fortran: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1/compilers/bin/nvfortran
    buildable: false

  # ------------------------------------------------------------------
  # MPI and CUDA - all placeholders (step 2 of the request). Nothing here
  # is confirmed against real hardware yet:
  #   - intel-oneapi-mpi is the ONLY mainstream MPI now (per user decision -
  #     mvapich/mpich are no longer part of the standard stack). It's only
  #     usable once we confirm it's actually installed on the cluster.
  #   - cuda is only relevant for GPU packages - TODO confirm GPU model.
  # Revisit the placeholder paths/versions once CLAUDE.md's "待确认的关键
  # 信息" questions (CPU微架构/GPU型号) are answered.
  # ------------------------------------------------------------------
  intel-oneapi-mpi:
    externals:
    - spec: intel-oneapi-mpi@2026.0.0
      # TODO(cluster): confirm this ships with the oneAPI version above and
      # get the real prefix (usually alongside intel-oneapi-compilers).
      prefix: /opt/intel/oneapi/mpi/2026.0.0
    buildable: false

  cuda:
    externals:
    - spec: cuda@12.6
      # TODO(cluster): confirm whether there are GPU nodes at all, and if
      # so which CUDA version/driver they run - this is a pure guess.
      prefix: /usr/local/cuda-12.6
    buildable: false

  all:
    providers:
      # Spack's own default order is [gcc, llvm, intel-oneapi-compilers] -
      # override it so Intel oneAPI is the mainstream default (confirmed
      # necessary by test-concretizing this environment: without this
      # override every spec silently picked gcc@14). gcc stays registered
      # as a fallback (see above) but is deliberately last, not a
      # co-equal default. nvhpc is intentionally NOT in this list - GPU
      # packages should pin `%nvhpc` explicitly rather than relying on
      # provider ordering to pick it up.
      c: [intel-oneapi-compilers, gcc]
      cxx: [intel-oneapi-compilers, gcc]
      fortran: [intel-oneapi-compilers, gcc]
      # intel-oneapi-mpi only - mvapich/mpich are no longer mainstream.
      mpi: [intel-oneapi-mpi]
