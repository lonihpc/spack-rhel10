# "hpc-software" Spack environment - step 4 of the request: this is where
# the target software list from CLAUDE.md gets concretized and installed.
#
# Usage (after sourcing spack/share/spack/setup-env.sh):
#   spack env activate -p environments/hpc-software
#   spack concretize          # safe to run locally on dellpro16 for drafting
#   spack install             # MUST run on a cluster compute node (sbatch),
#                              # never on login node - see CLAUDE.md
#
# config.yaml / packages.yaml / modules.yaml are pulled in via `include:` so
# they stay as separate, individually-reviewable/commit-able files instead
# of one giant spack.yaml.
spack:
  include:
  - config.yaml
  - packages.yaml
  - modules.yaml

  # Mainstream toolchain is Intel oneAPI + Intel MPI for everything (see
  # packages.yaml); nvhpc is only pinned per-package (`%nvhpc`) for GPU
  # builds. `unify: false` still lets those GPU packages diverge from the
  # rest of the environment instead of forcing one compiler everywhere.
  concretizer:
    unify: false

  # No shared filesystem view for now - module files (see modules.yaml) are
  # the actual delivery mechanism to end users, not an environment view.
  view: false

  # Versions intentionally left unpinned ("latest wins") per the request -
  # we're not copying the old cluster's exact versions. Everything defaults
  # to intel-oneapi-compilers + intel-oneapi-mpi via packages.yaml, so no
  # per-package %compiler pin is needed except for GPU packages, which
  # should pin `%nvhpc` explicitly once we know which ones need +cuda, e.g.:
  #   - bwa %nvhpc
  #   - namd +cuda %nvhpc
  specs:
  # amber: Spack's `amber` package only has versions 18/20 (no 22, unlike
  # the old cluster's amber/22) - it's licensed software, so Spack can only
  # offer versions someone has registered a checksum/resource for. Also
  # concretizes with "no compilers" (no explicit c/cxx/fortran dependency
  # in its package.py), so it won't get a compiler suffix from modules.yaml
  # projections the way other packages do - both confirmed by test
  # concretizing this environment, not guesses.
  - amber
  # ambertools: despite the intel-oneapi-compilers default, this one
  # concretizes as %gcc for c/cxx and %oneapi (ifx) only for fortran - a
  # package-level constraint in ambertools' own recipe, not a config
  # issue. Confirmed by test concretizing, not assumed.
  - ambertools
  - boost
  - bowtie2
  - bwa
  - cmake
  - mamba # conda/mamba - Spack package is `mamba` (micromamba installer)
  - cosma
  - cp2k
  - lammps
  - metis
  # mpich/mvapich2 are no longer part of the mainstream stack (intel-oneapi
  # + intel-mpi covers it, see packages.yaml) so neither is installed as a
  # standalone target anymore. For the record: mvapich2 (the old cluster's
  # package) is also fully deprecated in Spack's current repo - every
  # version fails concretization outright - so if MPI diversity is ever
  # needed again, use the `mvapich` successor package, not mvapich2.
  - namd
  # matlab is explicitly NOT here - CLAUDE.md says it's not a Spack package
  # and needs a manual install + hand-written modulefile instead.
