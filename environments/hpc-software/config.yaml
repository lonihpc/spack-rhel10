# Site-level `config:` section for the "hpc-software" Spack environment.
#
# All paths below are LOCAL PLACEHOLDERS for drafting/validating config on
# dellpro16 (WSL2). Nothing here builds software - `spack concretize` and
# `spack spec` don't need these paths to exist for real. Before running real
# `spack install` on the RHEL10 cluster, replace every path under
# /project/fchen14/spack-rhel10/spack-install with the actual shared
# filesystem path for that cluster (see CLAUDE.md step 3/10).
config:
  install_tree:
    root: /project/fchen14/spack-rhel10/spack-install
    projections:
      all: "{architecture.platform}-{architecture.target}/{name}-{version}-{hash}"

  # Downloaded source tarballs - safe to share across environments/instances.
  source_cache: /project/fchen14/spack-rhel10/spack-install/cache/sources

  # Misc metadata cache (package index, etc).
  misc_cache: /project/fchen14/spack-rhel10/spack-install/cache/misc

  # Build scratch space. On the real cluster this should point at fast local
  # scratch on the compute node (e.g. /local/scratch or $SLURM_TMPDIR), not
  # the shared filesystem - TODO once compute node layout is confirmed.
  build_stage:
    - $tempdir/$user/spack-stage

  # Only relevant for licensed software configured through Spack itself
  # (Matlab is NOT installed via Spack per CLAUDE.md, so likely unused).
  license_dir: /project/fchen14/spack-rhel10/spack-install/licenses

  # Placeholder - tune once we know real compute node core counts.
  build_jobs: 16
