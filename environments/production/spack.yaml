# "production" Spack environment - the real RHEL10 cluster deployment.
# Same software list and toolchain as environments/dev-local (see that
# file's comments for the reasoning behind each choice) - only the install
# location and module root differ.
#
# Usage (on the actual cluster, after sourcing spack/share/spack/
# setup-env.sh):
#   spack env activate -p environments/production
#   spack concretize
#   spack install             # MUST run on a compute node (sbatch/qsub),
#                              # never on the login node - see CLAUDE.md.
#
# Shared compiler/MPI/CUDA/target config lives in ../../config/{packages,
# modules}.yaml (see those files - single source of truth, not copied
# here). Only what's genuinely specific to this environment (install
# location, module root) is inline below.
spack:
  include:
  - ../../config/packages.yaml
  - ../../config/modules.yaml

  # PLACEHOLDER paths - /usr/local/packages/spack is a stand-in until the
  # real shared-filesystem layout is decided (single point to edit once
  # confirmed - everything else under it derives from this one root). This
  # is the production counterpart of environments/dev-local's config: -
  # same keys, only the root path differs.
  config:
    install_tree:
      root: /usr/local/packages/spack
      projections:
        all: "{architecture.platform}-{architecture.target}/{name}-{version}-{hash}"
    source_cache: /usr/local/packages/spack/cache/sources
    misc_cache: /usr/local/packages/spack/cache/misc
    # TODO(cluster): point this at fast local scratch on the compute node
    # (e.g. /local/scratch or $SLURM_TMPDIR) instead once the compute node
    # layout is confirmed - $tempdir/$user is a safe generic default until
    # then.
    build_stage:
    - $tempdir/$user/spack-stage
    license_dir: /usr/local/packages/spack/licenses
    # TODO(cluster): tune once we know real compute node core counts.
    build_jobs: 16

  # PLACEHOLDER - the exact modulefiles root/naming convention the cluster
  # already uses for its old linux-rhel8-icelake modules; matching that
  # convention for the new linux-rhel10-icelake tree per the user's
  # confirmed path.
  modules:
    default:
      roots:
        lmod: /usr/local/packages/Modules/default/modulefiles/linux-rhel10-icelake

  # Mainstream toolchain is Intel oneAPI + Intel MPI for everything (see
  # ../../config/packages.yaml); nvhpc is only pinned per-package
  # (`%nvhpc`) for GPU builds. `unify: false` still lets those GPU packages
  # diverge from the rest of the environment instead of forcing one
  # compiler everywhere.
  concretizer:
    unify: false
    # Not strictly required here since a real icelake compute node's
    # detected host target already matches packages:all:target: [icelake]
    # - kept for consistency with environments/dev-local (where it IS
    # required, see that file's comment) so the two spack.yaml files stay
    # as close to identical as possible outside of paths. Harmless either
    # way.
    targets:
      host_compatible: false

  # No shared filesystem view for now - module files are the actual
  # delivery mechanism to end users, not an environment view.
  view: false

  # Target software list - single source of truth is config/specs.yaml
  # (Spack's env schema has no way to `include:` a shared `specs:` list -
  # it's not one of the includable "section" files - so
  # scripts/render-specs.py splices it in here as plain text instead).
  # DO NOT hand-edit between the markers below: edit config/specs.yaml,
  # then run `python3 scripts/render-specs.py`.
  # >>> BEGIN GENERATED SPECS (from config/specs.yaml - do not edit by hand)
  specs:
  # amber: Spack's `amber` package only has versions 18/20 (no 22, unlike
  # the old cluster's amber/22) - it's licensed software, so Spack can only
  # offer versions someone has registered a checksum/resource for. Also
  # concretizes with "no compilers" (no explicit c/cxx/fortran dependency
  # in its package.py), so it won't get a compiler suffix from modules.yaml
  # projections the way other packages do - both confirmed by test
  # concretizing this environment, not guesses.
  #
  # +cuda NOT enabled here, unlike namd/lammps: Spack's amber package.py
  # hard-caps `amber@20:+cuda` at `cuda@:11.1`, further narrowed to exactly
  # `cuda@11.0:11.1` when combined with the `cuda_arch=80`-specific
  # `depends_on("cuda@11.0:", when="cuda_arch=80")` rule (both `when`
  # clauses apply simultaneously and intersect) - confirmed via
  # `spack info amber`. This is incompatible with our confirmed
  # cuda@13.3.0 - with cuda:buildable:false there's no way to satisfy both,
  # confirmed by concretize failing outright ("Cannot build cuda ... no
  # externals satisfy the request"). Options if GPU amber is actually
  # needed: get a newer amber recipe/patch that supports modern CUDA, or
  # keep a second, older external `cuda@11.0` or `cuda@11.1` around just for
  # amber (contradicts "one confirmed CUDA install" though) - left as a
  # decision for later rather than silently picking one.
  - amber
  # ambertools: despite the intel-oneapi-compilers default, this one
  # concretizes as %gcc for c/cxx and %oneapi (ifx) only for fortran - a
  # package-level constraint in ambertools' own recipe, not a config
  # issue. Confirmed by test concretizing, not assumed.
  - ambertools
  - boost
  - bowtie2
  - bwa
  - cmake
  - mamba # conda/mamba - Spack package is `mamba` (micromamba installer)
  - cosma
  - cp2k
  # Tier 1: first batch of additional target software added to validate the
  # bulk-build pipeline at closer-to-real list size. These 5 (plus cmake,
  # already above) only need a plain compiler - no MPI/CUDA - so no
  # %compiler pin is needed; they pick up intel-oneapi-compilers from the
  # default all.providers order in packages.yaml, same as cmake/cosma.
  - eigen
  - git
  - gsl
  - hwloc
  - valgrind
  - lammps +cuda cuda_arch=80 %nvhpc
  - metis
  # Tier 2: second batch, mid-sized libraries that depend on intel-oneapi-mpi
  # (unlike Tier 1's plain-compiler-only packages), added to validate the
  # bulk-build pipeline with MPI-linked dependency chains at closer-to-real
  # list size. metis is already above (Tier 1 predates this batch, and
  # parmetis depends on it); none of these 10 need an explicit %compiler pin
  # either - they pick up intel-oneapi-compilers/intel-oneapi-mpi from the
  # default all.providers order in packages.yaml.
  - fftw
  - hdf5
  - netcdf-c
  # netcdf-cxx4, not netcdf-cxx: the old cluster's netcdf-cxx/4.2 is the
  # deprecated legacy C++ interface - netcdf-cxx4 is the current, actively
  # maintained one.
  - netcdf-cxx4
  - netcdf-fortran
  - parallel-netcdf
  - parmetis
  - superlu-dist
  - hypre
  - petsc
  # Tier 3: third batch, bioinformatics tools. bowtie2 is already above
  # (predates this batch); none of these need an explicit %compiler pin
  # either - they pick up intel-oneapi-compilers/intel-oneapi-mpi from the
  # default all.providers order in packages.yaml.
  - hisat2
  - star
  - spades
  - vcftools
  - revbayes
  # mpich/mvapich2 are no longer part of the mainstream stack (intel-oneapi
  # + intel-mpi covers it, see packages.yaml) so neither is installed as a
  # standalone target anymore. For the record: mvapich2 (the old cluster's
  # package) is also fully deprecated in Spack's current repo - every
  # version fails concretization outright - so if MPI diversity is ever
  # needed again, use the `mvapich` successor package, not mvapich2.
  - namd +cuda cuda_arch=80 %nvhpc
  # matlab is explicitly NOT here - CLAUDE.md says it's not a Spack package
  # and needs a manual install + hand-written modulefile instead.
  # <<< END GENERATED SPECS
