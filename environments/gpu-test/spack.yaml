# "gpu-test" Spack environment - REAL (not --fake) bulk-build validation
# of the GPU family: cp2k, lammps, namd, all built with +cuda
# cuda_arch=80. Unlike environments/tierN-test (which validated NEW
# additions to the target software list), these three are already in
# config/specs.yaml - lammps and namd already pin +cuda there, cp2k does
# not yet (still plain/CPU there). This environment exists to validate
# the GPU-enabled builds for real, in bulk, before deciding whether to
# flip cp2k's entry in config/specs.yaml to +cuda too and before moving
# any of this to production (not urgent per user request - production's
# install_tree naming isn't finalized yet anyway).
#
# Building +cuda doesn't require an actual GPU device on the build node -
# only the external cuda toolchain (already registered in
# ../../config/packages.yaml) - same rationale as environments/
# smoke-test's `bwa %nvhpc` pin needing nvhpc findable/invokable but not
# a GPU to run on.
#
# IMPORTANT, reversed TWICE after real failed runs:
#
# Round 1: none of these 3 packages need %nvhpc as their HOST
# c/cxx/fortran compiler. All three handle CUDA via a mechanism fully
# decoupled from host-compiler choice - cp2k and lammps are
# CMakePackage+CudaPackage (CMake's native CUDA-as-a-language support
# calls nvcc for .cu files regardless of the C/CXX compiler; confirmed
# via each package.py), and namd's own build system points CUDADIR at the
# external `cuda` package directly (confirmed in namd's package.py - it
# even has dedicated flag handling for intel-oneapi-compilers as the host
# compiler). Forcing %nvhpc as host compiler anyway (an early
# project-wide "GPU packages use nvhpc" convention that made sense for
# CUDA-Fortran/OpenACC code but not for these three) dragged nvhpc into
# namd's charmpp/zstd dependencies, which have nothing to do with GPU
# code at all, and hit REAL nvhpc compiler bugs there: an internal
# compiler crash ("NVC++-F-0000-Internal compiler error") building
# charmpp, an assembler-incompatible instruction ("invalid instruction
# mnemonic 'plt'") building zstd, and a genuine stdatomic.h/converse.h
# `memory_order` redeclaration conflict. Switched to %oneapi.
#
# Round 2: %oneapi doesn't work either, for a DIFFERENT reason than
# nvhpc's compiler bugs: nvcc itself performs a host-compiler version/
# vendor check and flatly rejects icx - real failure: "Error> option: icx
# is not supported in this version!". This isn't Spack-specific; it's a
# known, general nvcc limitation (see e.g. spack/spack#40374 for the same
# class of problem with other +cuda packages). Confirmed via NVIDIA's own
# CUDA 13.4 Installation Guide "Supported Compilers" table: gcc 6.x-16.x,
# clang 7.x-22.x, and nvhpc 26.5 are all officially supported host
# compilers on x86_64 - icx is not listed at all. gcc 14 (used here) is
# within the supported range, so %gcc below is the one choice that's
# both nvcc-accepted AND free of nvhpc's own compiler bugs on
# charmpp/zstd. cp2k's fortran side still resolves to %oneapi regardless
# (cp2k's own package-level c/cxx-vs-fortran compiler split, unrelated to
# any of this - fortran code isn't touched by nvcc at all, so it's not
# subject to the same host-compiler restriction).
#
# Usage (on the actual cluster, from a compute node via sbatch - see
# scripts/gpu-test-install.sh, NOT on the login node):
#   spack env activate -p environments/gpu-test
#   spack concretize
#   spack install -j <cores>
#   spack module lmod refresh -y
#
# Shares the exact same compiler/MPI/CUDA/target config as dev-local and
# production (../../config/{packages,modules}.yaml - single source of
# truth, not copied here) so this test is actually representative of what
# production would do. Only the specs list and the (temporary) install
# location differ.
spack:
  include:
  - ../../config/packages.yaml
  - ../../config/modules.yaml
  - ../../config/repos.yaml

  # Temporary install location on the cluster, under this account, NOT
  # /usr/local/packages (that's reserved for the real production install -
  # see environments/production/spack.yaml) and NOT any of the other
  # environments/*-test directories either (kept separate so the tests
  # can't interfere with each other). Safe to `rm -rf` this whole tree
  # once this test is done with it.
  config:
    # install_tree lives on /project (a shared filesystem) - see
    # environments/tier3-test/spack.yaml's comment for the full story:
    # its fcntl advisory locks don't reliably release between processes,
    # which hung three straight `spack install` runs there regardless of
    # concurrency. scripts/gpu-test-install.sh already installs serially
    # (one spec per `spack install` call), so disabling Spack's own
    # locking here from the start (rather than rediscovering the same
    # hang) is safe - no real concurrent-write risk it would protect
    # against.
    locks: false
    install_tree:
      root: /project/fchen14/spack-rhel10-gpu-test/spack-install
      projections:
        all: "{architecture.platform}-{architecture.target}/{name}-{version}-{hash}"
    source_cache: /project/fchen14/spack-rhel10-gpu-test/spack-install/cache/sources
    misc_cache: /project/fchen14/spack-rhel10-gpu-test/spack-install/cache/misc
    build_stage:
    - $tempdir/$user/spack-stage
    license_dir: /project/fchen14/spack-rhel10-gpu-test/spack-install/licenses
    build_jobs: 16

  modules:
    default:
      roots:
        lmod: /project/fchen14/spack-rhel10-gpu-test/modulefiles

  # Same as dev-local/production/smoke-test/tier1-test/tier2-test/
  # tier3-test - see those files' comments for why.
  concretizer:
    unify: false
    targets:
      host_compatible: false

  view: false

  # Deliberately NOT including config/specs.yaml - that file already has
  # amber/ambertools/etc. not relevant here, and cp2k there is still
  # plain/CPU (not yet decided whether to flip it to +cuda). Only the 3
  # GPU packages being validated are listed here.
  #
  # %gcc is an explicit, deliberate pin (not left to the concretizer's
  # default provider order/reuse optimization to decide on its own) - see
  # the big comment above for why neither %nvhpc nor %oneapi work as the
  # host compiler for any of these three, and why %gcc is the one that
  # actually satisfies nvcc's own host-compiler support list without
  # hitting nvhpc's compiler bugs. cuda_arch=80 alone is what actually
  # drives GPU code generation (via the external `cuda` package),
  # completely independent of this pin.
  # lammps' `^fftw`: without it, the concretizer picks the external
  # intel-oneapi-mkl (already registered as the default fftw-api
  # provider in ../../config/packages.yaml) to satisfy lammps' fftw-api
  # dependency instead of building a real fftw. Spack doesn't manage
  # pkgconfig metadata for external packages, and MKL's FFTW-compatible
  # layer doesn't register itself under the standard "fftw3" pkg-config
  # name lammps' CMakeLists.txt looks for anyway - so configure fails
  # with "Package 'fftw3' ... not found" even though MKL is genuinely
  # present. Forcing a real, Spack-built `fftw` dependency sidesteps this
  # entirely (it correctly generates its own fftw3.pc).
  # cp2k's `^fftw`: same class of problem as lammps above, hit on job 62
  # after the CUDA-arch-probe fix let cp2k's cmake phase get much further
  # - "CMake Error ... Could NOT find Fftw (missing:
  # CP2K_FFTW3_LINK_LIBRARIES)" from cp2k's own cmake/modules/
  # FindFftw.cmake, even with intel-oneapi-mkl genuinely present and
  # -DCP2K_USE_FFTW3_WITH_MKL=ON passed - cp2k's FindFftw.cmake does its
  # own library detection and doesn't get told where to find MKL's
  # FFTW-compatible layer either. `^fftw` forces a real, Spack-built fftw
  # for cp2k's fftw-api dependency only (BLAS/LAPACK/ScaLAPACK stay on
  # MKL via CP2K_BLAS_VENDOR=MKL, unaffected by this pin) - confirmed via
  # `spack spec` that this resolves fftw@3.3.11 instead of MKL.
  # namd's `@3.0.3` pin: namd@2.14's CUDA kernels (e.g.
  # ComputeNonbondedCUDAKernelBase.h) use the legacy CUDA "texture
  # reference" API (`texture<...> force_table;` + `tex1D(force_table,
  # ...)`), which CUDA 13.3 has removed outright - not deprecated,
  # gone: `force_table`/`lj_table`/`energy_table`'s own declarations no
  # longer compile ("<error-type>" in the real build error), so every
  # tex1D/tex1Dfetch call site fails overload resolution. This is a
  # deep, invasive incompatibility spanning kernel declarations, host-
  # side binding code, and every call site - not a small patch like the
  # cufftResult/computeMode fixes above. namd@3.0.3's GPU backend was
  # rewritten (texture-object based throughout, confirmed via a clean
  # `spack concretize` - no texture-reference-era code path is even
  # reachable), so we build 3.0.3 instead of patching 2.14's legacy GPU
  # kernels by hand. Also manual-download (namd@3.0.3 needs its own
  # separate NAMD_3.0.3_Source.tar.gz placed in the source cache, same
  # procedure as 2.14).
  # namd's `^charmpp build-target=charm++`: charmpp's default
  # build-target is LIBS, which (per its own package.py comment) "also
  # builds AMPI and charm++" - AMPI being Charm++'s Adaptive MPI layer,
  # completely unused by namd (confirmed: namd's package.py never
  # references AMPI, only charmarch/prefix). Building it anyway hit a
  # real failure in job 61: AMPI's bundled ROMIO sub-library runs its own
  # autoconf "checking if a simple MPI program compiles and links" test
  # using charmpp's ampicc/ampif90 wrappers, which fails outright under
  # the netlrts backend we use (no real MPI present - that's the whole
  # point of netlrts) - "configure: error: Unable to compile a simple MPI
  # program." This has nothing to do with namd, cuda, or the host
  # compiler; it's an entire subsystem we don't need. `build-target=charm++`
  # (verified via `spack spec`) builds only charm++ itself, skipping AMPI/
  # ROMIO entirely and sidestepping the failure rather than debugging a
  # ROMIO/MPI configure issue for functionality namd never uses.
  #
  # namd PAUSED (2026-09-14, job 68), NOT in specs: below - after
  # 5 rounds of real, escalating CUDA-13.3-vs-namd incompatibilities
  # (texture-reference removal -> switched to namd@3.0.3; cudaDeviceProp
  # .computeMode removal; CUB/Thrust/libcu++ merged into CCCL with a
  # renamed dialect-check macro; CCCL itself now genuinely requiring
  # C++17, not just claiming to; and finally namd@3.0.3's own kernel
  # code - ComputeBondedCUDAKernel.cu, CudaTileListKernel.cu - directly
  # calling cub::LaneMaskLt/cub::Min/cub::Max, which CUDA 13.3's CCCL
  # has removed outright), the user decided to stop here rather than
  # continue: unlike every fix above (Makefile flags, cosmetic string
  # tables, dead diagnostic checks), this next round would mean hand-
  # patching real, numerically-active kernel code (warp-level thread
  # cooperation, min/max comparisons) sight-unseen (namd's source is
  # license-gated - no way to inspect ahead of time) with no way to
  # actually run it on a GPU to verify correctness. cp2k and lammps
  # both build and install successfully +cuda on this cluster (see
  # commit history for the full fix chain) - namd needs either a
  # version namd upstream has itself validated against CUDA 13.x, or
  # building against an older CUDA toolkit, before revisiting.
  specs:
  - cp2k +cuda cuda_arch=80 %gcc ^fftw
  - lammps +cuda cuda_arch=80 %gcc ^fftw
