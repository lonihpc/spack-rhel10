# Shared module-generation config (naming/projections only) for ALL
# "hpc-software" Spack environments (environments/dev-local and
# environments/production). Referenced via `include:` from both spack.yaml
# files - this is the single source of truth, never copy this file.
#
# Deliberately does NOT set `roots:` (where module files get written) -
# that's the one thing that differs between dev-local and production, so
# each environment's own spack.yaml sets `modules: default: roots: ...`
# inline; Spack merges that with the `lmod:`/`enable`/etc. from this file
# under the same `modules: default:` key.
#
# Target format (from CLAUDE.md, matching the existing linux-rhel8-icelake
# cluster):
#   <software>/<版本>/<compiler>-<compiler版本>[-cuda-<版本>][-<mpi>-<mpi版本>]
# amber is explicitly out of scope for this draft (per request) since it
# has no compiler dependency to format in the first place.
#
# IMPORTANT, verified by generating real module paths for concretized specs
# (spack.modules.lmod.LmodConfiguration/LmodFileLayout), not assumed from
# docs: unlike Tcl, Lmod ALWAYS nests every module under a "compiler"
# hierarchy tier (`Core/` for compilers listed in `core_compilers`, or
# `<compiler>/<version>/` otherwise) - this comes from Lmod's own file
# layout code, NOT from `projections`, so projections alone can never
# produce a fully flat namespace under Lmod. The fix that gets us there
# anyway: listing every compiler we register (intel-oneapi-compilers,
# nvhpc, gcc) as "core". Verified this makes every case land flat under
# Core/ with no `module load <compiler>` unlock step required, e.g.:
#   Core/cp2k/2026.1/intel-oneapi-compilers-2026.0.0-intel-oneapi-mpi-2026.0.0.lua
#   Core/namd/2.14/nvhpc-24.1-cuda-12.6-intel-oneapi-mpi-2026.0.0.lua      (+cuda %nvhpc)
#   Core/ambertools/25/gcc-14-intel-oneapi-mpi-2026.0.0.lua               (gcc/oneapi mix)
# Without this, nvhpc/gcc-built specs sit under nvhpc/24.1/... or
# gcc/14/... instead, requiring that extra module load first, AND the
# compiler name/version ends up duplicated (once as the directory, once in
# the leaf name) - see the report in CLAUDE.md for the full writeup of what
# projections can and can't do here.
#
# `projections` controls the LEAF name only (the part after "module load").
# Order matters: Spack's matcher (spack/lib/spack/spack/projections.py)
# returns the FIRST non-"all" key whose spec.satisfies() is true, so
# entries must go from most- to least-specific, with "all" last.
modules:
  default:
    enable: [lmod]
    arch_folder: false
    lmod:
      hash_length: 0
      hide_implicits: true
      # Every registered compiler is "core" so nothing needs a
      # `module load <compiler>` unlock step first (see the big comment
      # above) - this makes Lmod behave close to Tcl's flat style for our
      # naming purposes while keeping Lmod's other features (spider,
      # families, `ml`, etc.).
      core_compilers:
      - intel-oneapi-compilers@2026.1.0
      - nvhpc@26.5
      - gcc@14
      # Spack's own linux default already sets hierarchy: [mpi] - a plain
      # `hierarchy: []` here would just get MERGED with that default
      # (list configs merge, not replace) and mpi would still show up, so
      # this needs Spack's "::" override-key syntax to fully replace it.
      hierarchy:: []
      # Deliberately NOT adding "mpi" back in: doing so would put
      # intel-oneapi-mpi in the hierarchy too, requiring users to
      # `module load intel-oneapi-mpi/...` before mpi-linked software
      # becomes visible - the opposite of the old cluster's flat style. MPI
      # info is folded into the projection string instead (see below).
      all:
        autoload: direct
      projections:
        "^mpi ^cuda": "{name}/{version}/{compiler.name}-{compiler.version}-cuda-{^cuda.version}-{^mpi.name}-{^mpi.version}"
        "^cuda": "{name}/{version}/{compiler.name}-{compiler.version}-cuda-{^cuda.version}"
        "^mpi": "{name}/{version}/{compiler.name}-{compiler.version}-{^mpi.name}-{^mpi.version}"
        all: "{name}/{version}/{compiler.name}-{compiler.version}"

# --- What projections still CANNOT fix, even with the core_compilers trick
# above (see CLAUDE.md for the full two-option writeup) ---
# 1. Compiler *label* mismatch: {compiler.name} renders Spack's raw package
#    name "intel-oneapi-compilers", not the old cluster's short "intel".
#    ("nvhpc" and "gcc" already match, so this only affects the mainstream
#    case.) Spack has a display-alias table (spack/lib/spack/spack/
#    aliases.py, "intel-oneapi-compilers" -> "oneapi") but it's used only
#    for parsing legacy `%oneapi`-style spec strings, not exposed to
#    Spec.format()/projections, and its alias is "oneapi" anyway, not
#    "intel" - confirmed by testing, not assumed.
# 2. Same problem for MPI: {^mpi.name} renders "intel-oneapi-mpi", not the
#    old format's "intel-mpi".
# 3. Compiler/MPI *version numbers* won't match either: the old cluster's
#    numbers (e.g. "intel-2021.5.1") are the classic icc compiler's
#    internal version; ours is the oneAPI toolkit release version (e.g.
#    "2026.0.0") - a different numbering scheme entirely, not a formatting
#    difference, so there's nothing to reformat.
# None of these have a projection-syntax fix - the format string only ever
# stringifies real spec attributes, with no rename/lookup-table mechanism.
