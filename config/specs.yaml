# Single source of truth for the "hpc-software" target software list.
#
# Spack's environment schema has no way to `include:` a shared `specs:`
# list (only config/packages/modules/concretizer/etc "sections" are
# includable), so Spack itself never reads this file directly. Instead,
# scripts/render-specs.py injects everything from the `specs:` line below
# to the end of this file into BOTH environments/dev-local/spack.yaml and
# environments/production/spack.yaml, between their
# "BEGIN/END GENERATED SPECS" comment markers.
#
# To change the target software list:
#   1. Edit the `specs:` list below (this file only).
#   2. Run: python3 scripts/render-specs.py
#   3. `git diff` to review both regenerated spack.yaml files.
#   4. Commit config/specs.yaml and both spack.yaml files together.
#
# Versions intentionally left unpinned ("latest wins") per the request -
# we're not copying the old cluster's exact versions. Everything defaults
# to intel-oneapi-compilers + intel-oneapi-mpi via packages.yaml, so no
# per-package %compiler pin is needed except for GPU packages
# (lammps/cp2k/namd here), which pin `+cuda cuda_arch=80 %gcc` explicitly.
# cuda_arch=80 is a site-wide default preference in packages.yaml
# (confirmed GPU hardware).
#
# %gcc, NOT %nvhpc and NOT %oneapi, for the host c/cxx compiler - this
# was originally %nvhpc (an early "GPU packages use nvhpc" convention)
# and was real-compile-tested twice more in environments/gpu-test before
# landing here:
#   - %nvhpc: neither namd nor lammps actually needs nvhpc as host
#     compiler (both handle CUDA via a mechanism fully decoupled from
#     host-compiler choice - CMake's native CUDA-as-a-language support
#     for lammps, namd's own CUDADIR pointing straight at the external
#     `cuda` package) - forcing it anyway dragged nvhpc into namd's
#     charmpp/zstd dependencies (nothing to do with GPU code) and hit
#     real nvhpc compiler bugs: an internal compiler crash, an
#     assembler-incompatible instruction, and a stdatomic.h/converse.h
#     `memory_order` redeclaration conflict.
#   - %oneapi: fails for a completely different reason - nvcc itself
#     rejects icx outright ("option: icx is not supported in this
#     version!"), a known general nvcc limitation (see
#     spack/spack#40374), not something fixable via our config. Per
#     NVIDIA's own CUDA 13.4 install guide, gcc 6.x-16.x, clang 7.x-22.x,
#     and nvhpc are the only officially supported host compilers on
#     x86_64 - icx isn't listed.
#   - %gcc: the one choice both nvcc-accepted and free of nvhpc's
#     compiler bugs. Any other package that later grows a `+cuda` build
#     should follow the same `+cuda %gcc` pattern here, not `%nvhpc`.
#
# cp2k's `^fftw`: real-compile-validated in environments/gpu-test (job
# 62) before landing here. Without it, the concretizer picks the
# external intel-oneapi-mkl (registered as the default fftw-api
# provider) to satisfy cp2k's fftw-api dependency, but cp2k's own
# cmake/modules/FindFftw.cmake can't locate MKL's FFTW-compatible layer
# even with -DCP2K_USE_FFTW3_WITH_MKL=ON - "CMake Error ... Could NOT
# find Fftw (missing: CP2K_FFTW3_LINK_LIBRARIES)". Forcing a real,
# Spack-built fftw for cp2k's fftw-api dependency only sidesteps this
# (BLAS/LAPACK/ScaLAPACK stay on MKL via CP2K_BLAS_VENDOR=MKL,
# unaffected) - the same fix already used for lammps' fftw-api
# dependency above, and namd's cudaDeviceProp/CCCL/CUB fixes (see
# repos/spack_repo/rhel10_overrides/packages/cp2k/package.py for that
# package's other real-compile-found CUDA-13.3 fixes: a hardcoded
# CMAKE_CUDA_ARCHITECTURES placeholder using a since-removed
# compute_60, and 3 cufftResult error codes CUDA 13.3 has removed from
# cufft.h).
#
# namd's `@3.0.3 ... ^charmpp build-target=charm++ ^cuda@12.9.0`:
# real-compile-validated in environments/gpu-test (job 71, 2026-09-15)
# after 5 escalating rounds of CUDA-13.3 incompatibilities (see
# repos/spack_repo/rhel10_overrides/packages/namd/package.py for the
# computeMode/CCCL-macro-rename/C++17 source fixes). The last round -
# namd@3.0.3's own kernel code calling cub::LaneMaskLt/Min/Max, which
# CUDA 13.3's CCCL has removed outright - turned out not to be
# patchable at all: NAMD's own release notes cap official CUDA support
# at "9.1-12.x", so no namd version was ever going to build clean
# against CUDA 13.3. Resolved by researching that cap and setting up a
# SECOND, parallel `cuda@12.9.0` external (config/packages.yaml,
# installed standalone via --toolkit --toolkitpath, no driver, alongside
# the existing cuda@13.3.0) specifically for namd - `^cuda@12.9.0`
# pins namd to it while cp2k/lammps keep using the default cuda@13.3.0.
# build-target=charm++ on charmpp: see environments/gpu-test/spack.yaml's
# comment - without it, charmpp's default build-target=LIBS also builds
# the AMPI/ROMIO sub-library namd never uses, and ROMIO's own
# MPI-configure self-test fails outright under the netlrts backend.
specs:
# amber: Spack's `amber` package only has versions 18/20 (no 22, unlike
# the old cluster's amber/22) - it's licensed software, so Spack can only
# offer versions someone has registered a checksum/resource for. Also
# concretizes with "no compilers" (no explicit c/cxx/fortran dependency
# in its package.py), so it won't get a compiler suffix from modules.yaml
# projections the way other packages do - both confirmed by test
# concretizing this environment, not guesses.
#
# +cuda NOT enabled here, unlike namd/lammps: Spack's amber package.py
# hard-caps `amber@20:+cuda` at `cuda@:11.1`, further narrowed to exactly
# `cuda@11.0:11.1` when combined with the `cuda_arch=80`-specific
# `depends_on("cuda@11.0:", when="cuda_arch=80")` rule (both `when`
# clauses apply simultaneously and intersect) - confirmed via
# `spack info amber`. This is incompatible with our confirmed
# cuda@13.3.0 - with cuda:buildable:false there's no way to satisfy both,
# confirmed by concretize failing outright ("Cannot build cuda ... no
# externals satisfy the request"). Options if GPU amber is actually
# needed: get a newer amber recipe/patch that supports modern CUDA, or
# keep a second, older external `cuda@11.0` or `cuda@11.1` around just for
# amber (contradicts "one confirmed CUDA install" though) - left as a
# decision for later rather than silently picking one.
- amber
# ambertools: despite the intel-oneapi-compilers default, this one
# concretizes as %gcc for c/cxx and %oneapi (ifx) only for fortran - a
# package-level constraint in ambertools' own recipe, not a config
# issue. Confirmed by test concretizing, not assumed.
- ambertools
- boost
- bowtie2
- bwa
- cmake
- mamba # conda/mamba - Spack package is `mamba` (micromamba installer)
- cosma
- cp2k +cuda cuda_arch=80 %gcc ^fftw
# Tier 1: first batch of additional target software added to validate the
# bulk-build pipeline at closer-to-real list size. These 5 (plus cmake,
# already above) only need a plain compiler - no MPI/CUDA - so no
# %compiler pin is needed; they pick up intel-oneapi-compilers from the
# default all.providers order in packages.yaml, same as cmake/cosma.
- eigen
- git
- gsl
- hwloc
- valgrind
- lammps +cuda cuda_arch=80 %gcc
- metis
# Tier 2: second batch, mid-sized libraries that depend on intel-oneapi-mpi
# (unlike Tier 1's plain-compiler-only packages), added to validate the
# bulk-build pipeline with MPI-linked dependency chains at closer-to-real
# list size. metis is already above (Tier 1 predates this batch, and
# parmetis depends on it); none of these 10 need an explicit %compiler pin
# either - they pick up intel-oneapi-compilers/intel-oneapi-mpi from the
# default all.providers order in packages.yaml.
- fftw
- hdf5
- netcdf-c
# netcdf-cxx4, not netcdf-cxx: the old cluster's netcdf-cxx/4.2 is the
# deprecated legacy C++ interface - netcdf-cxx4 is the current, actively
# maintained one.
- netcdf-cxx4
- netcdf-fortran
- parallel-netcdf
- parmetis
- superlu-dist
- hypre
- petsc
# Tier 3: third batch, bioinformatics tools. bowtie2 is already above
# (predates this batch); none of these need an explicit %compiler pin
# either - they pick up intel-oneapi-compilers/intel-oneapi-mpi from the
# default all.providers order in packages.yaml.
- hisat2
- star
# ~sra: Spack's spades package.py defaults this variant (NCBI VDB/SRA file
# support) to True, but upstream SPAdes itself ships it disabled by
# default "due to possible compatibility issues" (see ablab/spades
# installation docs). With it on, the bundled ncbi-vdb fails ("atomic32.h
# file not found"). The core-code compile errors seen alongside it (no
# member 'is_minimal_'/'data' in key_with_hash.hpp/flat_set.hpp/
# flat_map.hpp) turned out to be UNRELATED real upstream source typos,
# not caused by +sra - fixed via repos/spack_repo/rhel10_overrides'
# spades package.py override, not by this variant.
#
# ~tools: default True, builds SPADES_ENABLE_PROJECTS:STRING=all
# (additional bundled sub-tools beyond the core assembler). One of them,
# pathracer (src/projects/pathracer), fails to compile - bare `nullptr_t`
# used without `std::` (relies on a non-portable old-compiler leak into
# the global namespace) and `#include <cstdatomic>` (a pre-C++11 draft
# header name that was renamed to <atomic> before C++11 shipped and never
# actually existed in any real toolchain since). This is old, unmaintained
# dead code, not something worth patching - not needed for pipeline
# validation anyway.
- spades ~sra ~tools
- vcftools
- revbayes
# mpich/mvapich2 are no longer part of the mainstream stack (intel-oneapi
# + intel-mpi covers it, see packages.yaml) so neither is installed as a
# standalone target anymore. For the record: mvapich2 (the old cluster's
# package) is also fully deprecated in Spack's current repo - every
# version fails concretization outright - so if MPI diversity is ever
# needed again, use the `mvapich` successor package, not mvapich2.
- namd@3.0.3 +cuda cuda_arch=80 %gcc ^charmpp build-target=charm++ ^cuda@12.9.0
# matlab is explicitly NOT here - CLAUDE.md says it's not a Spack package
# and needs a manual install + hand-written modulefile instead.
