# Shared compiler/MPI/CUDA/hardware configuration for ALL "hpc-software"
# Spack environments (environments/dev-local, environments/production,
# environments/smoke-test). Referenced via `include:` from every
# spack.yaml - this is the single source of truth, never copy this file.
#
# IMPORTANT: Spack v1.2.x removed compilers.yaml. Compilers are now declared
# as packages right here in packages.yaml (with a `compiler` tag), see
# `spack/lib/spack/docs/configuring_compilers.rst` in the cloned repo. An
# old-style compilers.yaml is still auto-migrated by Spack (with a
# deprecation warning) into this same format, so there is no separate
# compilers.yaml file in this repo.
#
# ALL EXTERNAL POLICY (confirmed decision - reverted from an earlier "fully
# self-contained/Spack-built" attempt): all 4 vendor toolchains below -
# intel-oneapi-compilers, intel-oneapi-mpi, nvhpc, cuda - are manually
# installed on the cluster and declared as `externals:` + `buildable:
# false`, pointing at their real install prefixes. Rationale for reverting:
# making these Spack-built ran into two real, reproducible Spack
# concretizer limitations - a package being BUILT in a solve can't also
# serve as the %compiler for something else in that same solve
# (spack/lib/spack/spack/solver/concretize.lp:1930), forcing an awkward
# two-phase install order, and even then Spack's reuse-driven
# concretization would sometimes pick a genuinely-built nvhpc/oneAPI as the
# compiler for unrelated low-level packages, overriding
# `all.providers` below and occasionally breaking unrelated builds (e.g.
# cmake, python) via their own recipe conflicts against %nvhpc. None of
# that can happen when these packages are external + non-buildable, so
# this is simpler and more robust. `gcc` (see below) is the one exception -
# the RHEL10 base system compiler kept as a last-resort fallback, not one
# of these 4 vendor toolchains.
#
# Versions/paths confirmed real (not guessed):
#   - intel-oneapi-compilers@2026.1.0
#   - intel-oneapi-mpi@2021.18.0 - Intel MPI has its OWN independent
#     version scheme (2021.x), not the oneAPI umbrella release number. An
#     earlier external declaration wrongly assumed intel-oneapi-mpi also
#     used "2026.0.0" - that version doesn't exist at all.
#   - nvhpc@26.5
#   - cuda@13.3.0 - matches the confirmed GPU driver's supported userspace
#     CUDA version.
packages:
  intel-oneapi-compilers:
    externals:
    - spec: intel-oneapi-compilers@2026.1.0
      prefix: /usr/local/packages/compilers/intel-oneapi-2026
    buildable: false

  # Fallback only - not a default provider (see all.providers below), and
  # NOT one of the 4 vendor toolchains above: this is RHEL10's own base
  # system gcc, kept registered in case some package genuinely refuses to
  # build with icx/icpx/ifx.
  gcc:
    externals:
    - spec: "gcc@14 languages='c,c++,fortran'"
      # TODO(cluster): confirm RHEL10's actual base gcc version/path (RHEL10
      # ships gcc 14.x by default at the time of writing, but verify).
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    buildable: true # also allow Spack to build other gcc versions if needed

  # GPU compiler - pin explicitly per package (`%nvhpc`) when +cuda is
  # needed, rather than relying on default provider ordering (see
  # all.providers below - nvhpc is deliberately not a default provider).
  nvhpc:
    externals:
    - spec: nvhpc@26.5
      prefix: /usr/local/packages/compilers/nvhpc/Linux_x86_64/26.5
    buildable: false

  # intel-oneapi-mpi is the ONLY mainstream MPI now (per user decision -
  # mvapich/mpich are no longer part of the standard stack).
  intel-oneapi-mpi:
    externals:
    - spec: intel-oneapi-mpi@2021.18.0
      prefix: /usr/local/packages/compilers/intel-oneapi-2026
    buildable: false

  # CUDA - confirmed by user: 13.3.0 is the target version, matching the
  # GPU driver's supported userspace CUDA version.
  cuda:
    externals:
    - spec: cuda@13.3.0
      prefix: /usr/local/packages/cuda/13.3
    buildable: false

  all:
    providers:
      # Spack's own default order is [gcc, llvm, intel-oneapi-compilers] -
      # override it so Intel oneAPI is the mainstream default. gcc stays
      # registered as a fallback (see above) but is deliberately last, not
      # a co-equal default. nvhpc is intentionally NOT in this list - GPU
      # packages should pin `%nvhpc` explicitly rather than relying on
      # provider ordering to pick it up.
      c: [intel-oneapi-compilers, gcc]
      cxx: [intel-oneapi-compilers, gcc]
      fortran: [intel-oneapi-compilers, gcc]
      # intel-oneapi-mpi only - mvapich/mpich are no longer mainstream.
      mpi: [intel-oneapi-mpi]
    # Confirmed CPU microarch for the new RHEL10 node - one setting for the
    # whole environment, no per-node-type profile needed (GPU and CPU-only
    # nodes are identical here except for the presence of a GPU). Soft
    # preference: ignored if the concretizer can reuse an existing install,
    # but otherwise steers every build toward -march/-mtune=icelake.
    target: [icelake]
    # Confirmed GPU: Ampere-class (e.g. A100, compute capability 8.0).
    # Soft default so any `+cuda` package (namd/lammps today, see
    # config/specs.yaml) picks up cuda_arch=80 without repeating it on
    # every spec line; per-package `cuda_arch=` on the spec still overrides
    # this if a future GPU package needs a different one.
    variants: cuda_arch=80
