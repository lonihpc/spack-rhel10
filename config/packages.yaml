# Shared compiler/MPI/CUDA/hardware configuration for ALL "hpc-software"
# Spack environments (environments/dev-local, environments/production,
# environments/smoke-test). Referenced via `include:` from every
# spack.yaml - this is the single source of truth, never copy this file.
#
# IMPORTANT: Spack v1.2.x removed compilers.yaml. Compilers are now declared
# as external packages right here in packages.yaml (with a `compiler` tag),
# see `spack/lib/spack/docs/configuring_compilers.rst` in the cloned repo.
# An old-style compilers.yaml is still auto-migrated by Spack (with a
# deprecation warning) into this same format, so there is no separate
# compilers.yaml file in this repo.
#
# None of the paths/versions below exist on the dev-local (WSL2) machine -
# they are placeholders. Decided stack (per user, supersedes the old
# cluster's gcc/nvhpc/intel mix): Intel oneAPI + Intel MPI is the mainstream
# toolchain for everything; nvhpc is kept only for packages that need GPU
# support (pin explicitly with `%nvhpc` per package, not as a default
# provider); gcc is kept registered purely as a last-resort fallback for the
# rare package that doesn't build with icx/icpx/ifx - it is NOT a default
# provider anymore (see `all.providers` below). mvapich/mpich are no longer
# part of the mainstream stack at all. Once we're on the real RHEL10 node,
# replace these with `spack compiler find <path>` output / real
# `spack external find` results - that's a single edit here, shared by both
# environments.
#
# CUDA is the one exception to "external": it's spack-built (see the `cuda:`
# entry below), not declared as an external system install. Explored making
# intel-oneapi-compilers/intel-oneapi-mpi/nvhpc spack-built too (a "fully
# self-contained" toolchain), but hit two real, reproducible Spack
# concretizer limitations doing so - documented in CLAUDE.md's "自包含
# 编译器工具链" section since they're worth knowing about if this gets
# revisited later:
#   1. Spack's concretizer refuses to let a package that would need to be
#      BUILT in the same solve also serve as the %compiler for something
#      else in that same solve (spack/lib/spack/spack/solver/
#      concretize.lp:1930, "Only external, or concrete, compilers are
#      allowed"). Installing each vendor toolchain in its own separate
#      `spack install` command (not batched together) works around this.
#   2. Even installed one at a time, "reuse" concretization can override
#      the packages:all:providers preference order unpredictably once any
#      compiler-providing package is genuinely built (not external) - e.g.
#      nvhpc got reused as the compiler for unrelated low-level packages
#      (bzip2, gdbm, even intel-oneapi-mpi itself) instead of respecting
#      `c: [intel-oneapi-compilers, gcc]`, and in one case a plain
#      unconstrained `cuda` build failed outright despite a valid external
#      gcc fallback being available. No clean fix found for this one.
# CUDA itself doesn't hit either problem since it isn't a compiler-language
# provider (doesn't satisfy the c/cxx/fortran virtuals), so it was safe to
# make self-contained on its own.
packages:
  intel-oneapi-compilers:
    externals:
    - spec: intel-oneapi-compilers@2026.0.0
      # TODO(cluster): confirm actual installed oneAPI version - 2026.0.0 is
      # CLAUDE.md's stated target, verify against what Intel has shipped by
      # the time we install on real hardware.
      prefix: /opt/intel/oneapi
      extra_attributes:
        compilers:
          c: /opt/intel/oneapi/compiler/2026.0.0/bin/icx
          cxx: /opt/intel/oneapi/compiler/2026.0.0/bin/icpx
          fortran: /opt/intel/oneapi/compiler/2026.0.0/bin/ifx
    buildable: false

  # Fallback only - not a default provider (see all.providers below). Kept
  # registered in case some package genuinely refuses to build with icx.
  gcc:
    externals:
    - spec: "gcc@14 languages='c,c++,fortran'"
      # TODO(cluster): confirm RHEL10's actual base gcc version/path (RHEL10
      # ships gcc 14.x by default at the time of writing, but verify).
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    buildable: true # also allow Spack to build other gcc versions if needed

  # GPU compiler - pin explicitly per package (`%nvhpc`) when +cuda is
  # needed, rather than relying on default provider ordering.
  nvhpc:
    externals:
    - spec: nvhpc@24.1
      # TODO(cluster): confirm exact NVHPC version/path once GPU node
      # details (model, driver) are known.
      prefix: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1
      extra_attributes:
        compilers:
          c: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1/compilers/bin/nvc
          cxx: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1/compilers/bin/nvc++
          fortran: /opt/nvidia/hpc_sdk/Linux_x86_64/24.1/compilers/bin/nvfortran
    buildable: false

  # ------------------------------------------------------------------
  # MPI: intel-oneapi-mpi is the ONLY mainstream MPI now (per user decision
  # - mvapich/mpich are no longer part of the standard stack). Path/version
  # still a placeholder - only usable once we confirm it's actually
  # installed on the cluster.
  #
  # Version corrected while investigating the self-contained-toolchain
  # question above: Intel MPI has its OWN independent version scheme
  # (2021.x), separate from the oneAPI umbrella release number - our
  # previous "2026.0.0" guess doesn't exist as a real Intel MPI version at
  # all (confirmed via `spack versions intel-oneapi-mpi`). 2021.18.0 is the
  # real latest as of this Spack v1.2.2 checkout.
  # ------------------------------------------------------------------
  intel-oneapi-mpi:
    externals:
    - spec: intel-oneapi-mpi@2021.18.0
      # TODO(cluster): confirm this ships alongside the oneAPI version
      # above and get the real prefix (usually alongside
      # intel-oneapi-compilers).
      prefix: /opt/intel/oneapi/mpi/2021.18.0
    buildable: false

  # CUDA - confirmed by user: 13.3.0 is the target version, matching the
  # GPU driver's supported userspace CUDA version. Spack-built (not
  # external) - see the big comment at the top of this file for why this
  # is safe for cuda specifically but wasn't pursued for the other three.
  cuda:
    require: "@13.3.0"

  all:
    providers:
      # Spack's own default order is [gcc, llvm, intel-oneapi-compilers] -
      # override it so Intel oneAPI is the mainstream default (confirmed
      # necessary by test-concretizing this environment: without this
      # override every spec silently picked gcc@14). gcc stays registered
      # as a fallback (see above) but is deliberately last, not a
      # co-equal default. nvhpc is intentionally NOT in this list - GPU
      # packages should pin `%nvhpc` explicitly rather than relying on
      # provider ordering to pick it up.
      c: [intel-oneapi-compilers, gcc]
      cxx: [intel-oneapi-compilers, gcc]
      fortran: [intel-oneapi-compilers, gcc]
      # intel-oneapi-mpi only - mvapich/mpich are no longer mainstream.
      mpi: [intel-oneapi-mpi]
    # Confirmed CPU microarch for the new RHEL10 node - one setting for the
    # whole environment, no per-node-type profile needed (GPU and CPU-only
    # nodes are identical here except for the presence of a GPU). Soft
    # preference: ignored if the concretizer can reuse an existing install,
    # but otherwise steers every build toward -march/-mtune=icelake.
    target: [icelake]
    # Confirmed GPU: Ampere-class (e.g. A100, compute capability 8.0).
    # Soft default so any `+cuda` package (namd/lammps today, see
    # config/specs.yaml) picks up cuda_arch=80 without repeating it on
    # every spec line; per-package `cuda_arch=` on the spec still overrides
    # this if a future GPU package needs a different one.
    variants: cuda_arch=80
